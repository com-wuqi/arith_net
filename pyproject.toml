[project]
name = "torchhere"
version = "0.1.0"
description = "PyTorch (CUDA) + TensorFlow + matplotlib playground"
requires-python = ">=3.13,<3.14"
dependencies = [
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "matplotlib>=3.11.2",
    "tensorflow>=2.21.0",
    "jupyterlab>=4.6.4",
    "ipykernel",
    "scikit-learn>=1.9.1",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]
